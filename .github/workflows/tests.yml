name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  # lets the release workflow run the tests first
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip fire pytest-homeassistant-custom-component
        python3 requirements_from_manifest.py custom_components/blnet/manifest.json > requirements.txt
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Validate the integration like Home Assistant does
      uses: home-assistant/actions/hassfest@master
